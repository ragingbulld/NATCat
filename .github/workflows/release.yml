name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Test
        run: go test ./...

      - name: Build release binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/natcat-linux-amd64 ./cmd/natcat
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o dist/natcat-windows-amd64.exe ./cmd/natcat
          cd dist
          tar -czf natcat-linux-amd64.tar.gz natcat-linux-amd64
          zip -q natcat-windows-amd64.zip natcat-windows-amd64.exe
          sha256sum natcat-linux-amd64 natcat-linux-amd64.tar.gz natcat-windows-amd64.exe natcat-windows-amd64.zip > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/natcat-linux-amd64
            dist/natcat-linux-amd64.tar.gz
            dist/natcat-windows-amd64.exe
            dist/natcat-windows-amd64.zip
            dist/SHA256SUMS.txt
