name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Test
        run: go test ./...

      - name: Build release binaries
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          linux_dir="dist/natcat-${version}-linux-amd64"
          windows_dir="dist/natcat-${version}-windows-amd64"
          mkdir -p "${linux_dir}" "${windows_dir}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "${linux_dir}/natcat" ./cmd/natcat
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o "${windows_dir}/natcat.exe" ./cmd/natcat
          cp README.md LICENSE "${linux_dir}/"
          cp README.md LICENSE "${windows_dir}/"
          tar -czf "dist/natcat-${version}-linux-amd64.tar.gz" -C dist "natcat-${version}-linux-amd64"
          cd dist
          zip -qr "natcat-${version}-windows-amd64.zip" "natcat-${version}-windows-amd64"
          sha256sum "natcat-${version}-linux-amd64.tar.gz" "natcat-${version}-windows-amd64.zip" > "SHA256SUMS-${version}.txt"

      - name: Delete existing release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name' |
              while read -r asset; do
                if [ -n "${asset}" ]; then
                  gh release delete-asset "${GITHUB_REF_NAME}" "${asset}" --yes
                fi
              done
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/natcat-${{ github.ref_name }}-linux-amd64.tar.gz
            dist/natcat-${{ github.ref_name }}-windows-amd64.zip
            dist/SHA256SUMS-${{ github.ref_name }}.txt
